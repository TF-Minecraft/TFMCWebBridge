# ProvinceSystem API (plugin key). Do not commit real production secrets.
api:
  base-url: "http://127.0.0.1:8000"
  plugin-key: "dev-plugin-key"

# Multi-server identity for minted codes (Plan 2) and plugin ingest/apply
# filters (Plan 3). Lobby + main share "main"; tutorial/dev use their own ids.
# Other plugins soft-depend TFMCWeb and call TFMCWeb.getRealmId() — do not
# duplicate realm.id in RPCharacters / ArmourShop / DrinkBuilder configs.
realm:
  id: main

# Which /token create scopes this box allows. Empty list = tokens disabled.
# Lobby example: [profile] only. Tutorial: [].
tokens:
  enabled-scopes:
    - skin
    - drink
    - profile
    - skin_staff

# Shared mint cooldown for skin + drink (/token create). Character is excluded.
# cooldown-days: -1 = cannot mint; 0 = no wait; >0 = days between mints.
# Groups are listed low→high tier; highest matching LP permission wins.
token-cooldowns:
  shared-scopes:
    - skin
    - drink
  defaults:
    cooldown-days: -1
  groups:
    - permission: rpchar.group.noble
      cooldown-days: 28
    - permission: rpchar.group.gilded
      cooldown-days: 21
    - permission: rpchar.group.ascended
      cooldown-days: 14
    - permission: rpchar.group.legacy
      cooldown-days: 7

# Web entitlements pushed to ProvinceSystem on join (rpc_player_meta).
# Duplicated ladders — keep in sync with plugin permission-groups.yml:
#   rpcharacters/src/main/resources/permission-groups.yml
#   armourshop/src/main/resources/permission-groups.yml
#   drinkbuilder/src/main/resources/permission-groups.yml
# TFMCWeb only posts values; plugins still own in-game unlock semantics.
# Optional per-realm overrides (falls back to top-level rpc/skins/drinks):
#   player-meta.by-realm.dev.rpc: { defaults: ..., groups: [...] }
player-meta:
  # Boolean LP snapshots stored in permission_flags (keys = perm nodes).
  sync-permissions:
    - rulequiz.completed
    - tfmc.map.staff

  # by-realm:
  #   tutorial:
  #     rpc:
  #       defaults:
  #         max-alive-characters: 1
  #   dev:
  #     rpc:
  #       defaults:
  #         max-alive-characters: 10

  rpc:
    defaults:
      name-colour-stops: 0
      max-alive-characters: 3
      wardrobe-skin-slots: 1
    groups:
      - permission: rpchar.group.noble
        tier: 1
        name-colour-stops: 1
        max-alive-characters: 3
        wardrobe-skin-slots: 1
      - permission: rpchar.group.gilded
        tier: 2
        name-colour-stops: 2
        max-alive-characters: 4
        wardrobe-skin-slots: 2
      - permission: rpchar.group.ascended
        tier: 3
        name-colour-stops: 20
        max-alive-characters: 5
        wardrobe-skin-slots: 3
      - permission: rpchar.group.legacy
        tier: 4
        name-colour-stops: 20
        max-alive-characters: 5
        wardrobe-skin-slots: 3

  skins:
    defaults:
      name-colour-stops: 0
      max-3d-pair-bytes: 30720
      skin-token-cooldown-days: -1
      skin-kinds: []
      allow-armor-3d-helmet: false
    groups:
      - permission: rpchar.group.noble
        tier: 1
        name-colour-stops: 1
        skin-token-cooldown-days: 28
        skin-kinds: [handheld, large_handheld, bow, large_bow, crossbow, book]
      - permission: rpchar.group.gilded
        tier: 2
        name-colour-stops: 2
        skin-token-cooldown-days: 21
        skin-kinds: [armor_set]
      - permission: rpchar.group.ascended
        tier: 3
        name-colour-stops: 20
        skin-token-cooldown-days: 14
        skin-kinds: [item_3d, shield, helmet_3d, mask, gun]
        allow-armor-3d-helmet: true
      - permission: rpchar.group.legacy
        tier: 4
        name-colour-stops: 20
        skin-token-cooldown-days: 7
        allow-armor-3d-helmet: true

  drinks:
    defaults:
      name-colour-stops: 0
      allow-drink-texture: false
      allow-drink-message: false
    groups:
      - permission: rpchar.group.noble
        tier: 1
        name-colour-stops: 1
        allow-drink-texture: false
      - permission: rpchar.group.gilded
        tier: 2
        name-colour-stops: 2
        allow-drink-texture: true
      - permission: rpchar.group.ascended
        tier: 3
        name-colour-stops: 8
        allow-drink-texture: true
        allow-drink-message: true
      - permission: rpchar.group.legacy
        tier: 4
        name-colour-stops: 8
        allow-drink-texture: true
        allow-drink-message: true

# Patreon supporter ranks. LuckPerms storage is shared across servers, so
# set apply-ranks true on exactly one server. /patreon still works everywhere.
patreon:
  enabled: false
  apply-ranks: false
  poll-seconds: 60
  reconcile-minutes: 30
  groups:
    noble: noble
    gilded: gilded
    ascended: ascended

# Mirror this server's ban list to Discord (DM + Banned role on ban, role
# cleared on unban or when a timed ban expires). Linked players only. The list
# is checked every poll-seconds; changes apply on restart. The same ban
# reported by several servers sends one Discord message.
# sync: also apply bans and unbans made on the other servers that use this
# API, so one /ban covers them all. Set true on each server that should share
# bans (TFMCMain and TFMCLobby).
ban-mirror:
  enabled: true
  poll-seconds: 30
  sync: false

# Staff-panel LuckPerms bridge. LuckPerms storage is shared across servers, so
# set apply true on exactly one server. publish only sends data to this server's site.
luckperms-bridge:
  publish: false
  apply: false
  poll-seconds: 3
  snapshot-seconds: 30
